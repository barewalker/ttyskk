# GUI の入力メソッドに載せるための C ABI は別 crate にしてある。
# 実行ファイルを作るだけなら関係しない (cargo build -p ttyskk)。
[workspace]
members = ["capi"]

[package]
name = "ttyskk"
version = "0.4.2"
edition = "2024"
description = "In-terminal SKK Japanese input method. Wraps a child process in a pty and overlays unconfirmed text, so the child never sees it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barewalker/ttyskk"
readme = "README.md"
keywords = ["skk", "ime", "japanese", "terminal", "pty"]
categories = ["command-line-utilities", "text-processing"]

rust-version = "1.88"

# 変換エンジン。端末にも GUI の入力メソッドにも載せられるよう、画面まわりを含まない。
[lib]
name = "ttyskk"
path = "src/lib.rs"

# 端末に載せた実行ファイル。擬似端末と重ね描きを使うので tty が要る。
[[bin]]
name = "ttyskk"
path = "src/main.rs"
required-features = ["tty"]

[features]
default = ["tty"]
# 端末側の実装に要るもの。エンジンだけ使う側は default-features = false で落とせる。
tty = ["dep:libc", "dep:nix", "dep:portable-pty", "dep:signal-hook", "dep:vte"]

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.35"
# スニペット (VS Code 形式の *.code-snippets) を読むため。toml が既に serde と
# serde_json を引き込んでいるので、直接の依存にしても crate は増えない。
serde_json = "1.0.151"
toml = "1.1.3"
unicode-width = "0.2.2"

libc = { version = "0.2.189", optional = true }
nix = { version = "0.31.3", features = ["term", "signal"], optional = true }
portable-pty = { version = "0.9.0", optional = true }
signal-hook = { version = "0.4.4", optional = true }
vte = { version = "0.15.0", optional = true }

# 試験だけで使う。migemo が作った正規表現を実際に当ててみるため (ripgrep と同じ
# regex crate なので、あちらでの当たり方をそのまま確かめられる)。
[dev-dependencies]
regex = "1.11"
