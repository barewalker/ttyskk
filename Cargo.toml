[package]
name = "ttyskk"
version = "0.1.0"
edition = "2024"
description = "In-terminal SKK Japanese input method. Wraps a child process in a pty and overlays unconfirmed text, so the child never sees it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barewalker/ttyskk"
readme = "README.md"
keywords = ["skk", "ime", "japanese", "terminal", "pty"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.35"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["term", "signal"] }
portable-pty = "0.9.0"
signal-hook = "0.4.4"
toml = "1.1.3"
unicode-width = "0.2.2"
vte = "0.15.0"
