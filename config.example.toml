# ttyskk の設定例。~/.config/ttyskk/config.toml に置く。
#
# 書いた項目だけが既定を上書きする。ファイルが無ければ全部既定のまま。
# 書き換えると動いている ttyskk にそのまま反映される (起動し直さなくてよい)。
# 書き方を間違えた設定は捨てられ、それまでの設定が使われ続ける。
# 手元で確かめるには `ttyskk --check-config`。

[keys]
# キーの書き方: "C-j" "Ctrl-j" "ctrl+j" / "space" "enter" "tab" "esc" "bs" /
#               "q" "/" のような一文字そのもの
# 一つの動作に複数割り当てるなら並びで書く: cancel = ["C-g", "esc"]

kana = "C-j"             # ASCII・全角英数から かなモードへ
confirm = "C-j"          # 入力中のローマ字・見出し語・候補を確定する
cancel = "C-g"           # 取り消す
ascii = "l"              # ASCII モードへ
zenkaku = "L"            # 全角英数モードへ
katakana = "q"           # ひらがな ⇄ カタカナ / ▽ をカタカナにして確定
start_conversion = "Q"   # 空の見出し語で変換を始める (複合語向け)
abbrev = "/"             # ASCII の見出し語で変換する
convert = "space"        # 変換する / 次の候補へ
previous = "x"           # 前の候補へ

# 候補一覧から選ぶキー。並び順がそのまま一覧の並び順になり、
# 個数がそのまま一頁の候補数になる。
select = ["a", "s", "d", "f", "j", "k", "l"]

[candidates]
# 何番目の候補から横並びの一覧を出すか。
# 4 なら 4 つ目までは一つずつ送り、5 つ目に達したところで一覧になる。
inline = 4

# 一覧の出し方。
#   "inline" … 入力中の行に続けて横並び (既定)。行が伸びて折り返すことがある。
#   "float"  … カーソルの下の行に一行で浮かせる (最下行なら上の行)。
#              行が伸びず縦にも広がらないので、nvim の補完 popup と重なりにくい。
layout = "inline"

[behavior]
# 押したときに ASCII モードへ戻すキー。
#
# vim / nvim で挿入モードを抜けたとき、かなモードが残っていると次の `dd` や `:w` が
# 日本語になってしまう。Esc は挿入モードを抜けるキーそのものなので、これを合図に
# ASCII へ戻す。Esc は子アプリにもそのまま渡るので、vim 側の設定は要らない。
#
# nvim で実測したところ、挿入モードを抜けるのは Esc と C-c。C-d は抜けない
# (インデントを一段戻す) ので既定に入れていない。
# 空の並び [] にすると何もしない。
ascii_keys = ["esc", "C-c"]

# モードの印の出し方。
#
#   "cell"   … カーソル位置のセルに色を敷く (既定)。文字を足さないので行の長さも
#              中身も変わらない。カーソルそのものが色付いたように見える。
#              この方式のときはカーソルの形を下線に固定する (ブロックだと色を覆う)。
#   "beside" … カーソルの右隣のセルに色を敷く。カーソルに覆われないので、
#              多重化器がカーソルの見た目を遅れて同期する環境 (herdr がそう) でも
#              確実に見える。
#   "letter" … カーソルの直後に あ / ア / 半 / Ａ を出す。
#   "off"    … 何も描かない。カーソルの形だけでモードを表す。
#
# 端末多重化器を挟むとカーソルの色 (OSC 12) が途中で吸われる (herdr が実際にそう)。
# 文字として書いた色はそのまま届くので、cell と letter はその性質を使っている。
# ASCII モードでは何も描かないので、そのときの完全透過は保たれる。
mode_marker = "cell"

# 接頭辞・接尾辞に続けて確定した語を、繋げて辞書に覚えるか。
# 「さい>」→再 のあと「りよう」→利用 と確定したら さいりよう /再利用/ を覚える。
# ddskk の skk-learn-combined-word と同じ。
learn_combined = true
