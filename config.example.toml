# ttyskk の設定の見本です。~/.config/ttyskk/config.toml に置きます。
#
# 設定できる項目を全部、既定値のまま書き並べて行頭の # で無効にしてあります。
# 変えたい行だけ # を外してください。書いた項目だけが既定を上書きするので、
# 触らない行は消してしまってもかまいません。
#
# 手元に取り出す:
#     mkdir -p ~/.config/ttyskk
#     ttyskk --config-example > ~/.config/ttyskk/config.toml
#
# 書き換えると動いている ttyskk にそのまま反映されます (起動し直す必要はありません)。
# 書き方を間違えた設定は捨てられ、それまでの設定が使われ続けます。
# 手元で確かめるには `ttyskk --check-config` を実行してください。
#
# 説明の行は「#」のあとに空白、無効にしてある設定の行は「#」の直後から始まります。

[keys]
# キーの書き方: "C-j" "Ctrl-j" "ctrl+j" / "space" "enter" "tab" "esc" "bs" "s-tab" /
#               "left" "right" "up" "down" "home" "end" / "q" "/" のような一文字そのもの
# 一つの動作に複数割り当てるなら並びで書きます: cancel = ["C-g", "esc"]
#
# 矢印と Home / End は端末によって送られる形が違います (CSI 形 / SS3 形 / rxvt 形)。
# 名前で書けばその全部が割り当てになるので、どの端末でも同じように効きます。
#
# Ctrl や Shift の付いたキーは、割り当てるとそれだけで Claude Code のような拡張鍵盤
# プロトコルを使うアプリの下でも効きます (ttyskk が CSI 106;5u のような形を素の形に
# 戻す対象を、この節から作っているためです)。
#
# Ctrl は英字のほか @ \ ] ^ _ にも付きます ("C-]" など)。英字の制御キーは端末・シェル・
# 編集器のどれかが必ず使っていますが、記号側はほとんど空いています。子アプリからキーを
# 奪う割り当て (下の reload) の置き場になります。C-[ は Esc そのものなので "esc" と
# 書いてください。

#kana = "C-j"                # ASCII・全角英数から かなモードへ
#confirm = "C-j"             # 入力中のローマ字・見出し語・候補を確定する
#cancel = "C-g"              # 取り消す
#ascii = "l"                 # ASCII モードへ
#zenkaku = "L"               # 全角英数モードへ
#katakana = "q"              # ひらがな ⇄ カタカナ / ▽ をカタカナにして確定
#hankaku_katakana = "C-q"    # ひらがな ⇄ 半角カタカナ / ▽ を半角カタカナにして確定
#start_conversion = "Q"      # 空の見出し語で変換を始める (複合語向け)
#abbrev = "/"                # ASCII の見出し語で変換する
#latin = "C-l"               # ▽ の見出し語を打った綴り (ASCII) に置き換える
#convert = "space"           # 変換する / 次の候補へ
#previous = "x"              # 前の候補へ
#complete = "tab"            # ▽ の見出し語を前方一致で補完する / 次の補完候補へ
#complete_previous = "s-tab" # 前の補完候補へ
#purge = "X"                 # ▼ の候補を利用者辞書から取り除く
#affix = ">"                 # 接頭辞・接尾辞変換を始める (▽ の末尾、または ▼ の確定後)

# 前置キー (sticky shift)。Shift の同時押しを使わずに ▽ へ入るためのものです。押した
# 次の一打鍵を大文字として扱うので、;k ;a と打てば ▽か に入り、▽かんが のあと ;e で
# 送り仮名が始まります。押した時点で ▽ (かなモード) か * (▽ の途中) が出るので、
# どこを切るのかが目で分かります。ddskk の skk-sticky-key と同じ考え方です。
#
# かなモードでだけ効きます。ASCII・全角英数と、/ の ASCII 見出し語では素通しします。
#
# 既定を空にしてあるのは、割り当てた文字が二度押しでしか打てなくなるためです
# (; に割り当てると ; 自身は ;; になります)。Shift を押せる人には打鍵が増えるだけ
# なので、要る人が選ぶ形にしてあります。
#
#     sticky = ";"
#
# AZIK (behavior.romaji = "azik") では ; が「っ」なので食い合います。前置キーが先に
# 効くため「っ」が打てなくなります。AZIK と併せるなら別のキーへ移してください
# (--check-config で断りが出ます)。
#
# 既定が「割り当てなし」なので、他の項目と違って既定値を書いた行は置けません。

# ▽ の見出し語の中を動いて直すためのキーです。▽ でだけ効き、それ以外では子アプリへ
# そのまま渡ります。C-g で ▼ から ▽ に戻したあと、打ち間違えた一文字だけを直すのに
# 使います。
#move_left = ["C-b", "left"]      # カーソルを一文字左へ
#move_right = ["C-f", "right"]    # カーソルを一文字右へ
#move_home = ["C-a", "home"]      # 見出し語の先頭へ
#move_end = ["C-e", "end"]        # 見出し語の末尾へ
#delete_forward = "C-d"           # カーソル位置の一文字を消す (backspace は手前を消す)

# カーソルの手前を一文字消すキーです。▽ では見出し語から、▼ では前の候補へ戻ります。
#
# 消すものが無ければ**押されたキーのまま**子アプリへ渡ります。C-h を 0x7f に揃えたり
# はしません — nvim の <C-h> (窓の移動) のように、C-h に別の働きを割り当てているアプリ
# でそれが効かなくなるためです。文字を打つ段では、どのみちアプリ側が C-h を手前の一文字
# 消しに割り当てているので、そのまま渡せば消えます。
#
# **ここから外したキーは、拡張鍵盤プロトコルを使うアプリ (Claude Code や nvim) の
# 下では ttyskk に届かなくなる**ので、▽ の途中で押すと見出し語がそこで確定します。
# C-h を ttyskk に一切触らせたくない場合だけ ["bs"] にしてください。
#backspace = ["bs", "C-h"]        # 手前の一文字を消す

# 候補一覧から選ぶキーです。並び順がそのまま一覧の並び順になり、
# 個数がそのまま一頁の候補数になります。
#select = ["a", "s", "d", "f", "j", "k", "l"]

# 定型文 ([snippets]) を編集器で開くキーです。既定は空 (割り当てなし)。かなモードで
# だけ効きます。
#
# 辞書登録の途中なら、何も打っていないところで変換キー (space) を押せば
# [スニペットを登録] が出るので、覚えるキーなしで書きに行けます。こちらは「変換に
# 入る前から書きたい」「一覧を見たい」ときのためのものです。
#
# 既定を空にしてあるのは、安全な空きが無いためです。ローマ字の先頭にならない英字は
# l と q の二つだけで、どちらも既に使っています。制御キーは端末・シェル・編集器・
# GUI の入力メソッドのどれかが必ず使っていて、空きは環境ごとに違います (C-o は
# emacs の open-line、Windows の keyhac では IME on に割り当てられていることが
# あります)。決め打ちせず、空いているものを自分で選んでください。
#
#     snippet_edit = "C-t"
#
# 既定が「割り当てなし」なので、他の項目と違って既定値を書いた行は置けません
# (空の並びは書けず、要らないなら項目ごと消す決まりのためです)。

# 新しい実体へ差し替えるキーです。既定は空 (割り当てなし)。
#
# `ttyskk --reload` と同じことを、シェルへ戻らずに起こせます。編集器やエージェントの
# 中にいるときほど、抜けて打ち直す手間が高くつきます。子はそのまま生き続けます。
#
# どのモードでも効きます。差し替えは入力の操作ではなく包んでいる側の操作なので、
# ASCII モードでも受け取ります。その代わり、割り当てたキーは子アプリへ渡らなくなり
# ます。子が使っていないキーを選んでください。C-] や C-\ は使うアプリがほとんど
# ありません。
#
# 変換や辞書登録の途中では効きません (打ち込んだものが消えるためです)。そのときは
# 押しても素通しで子へ渡ります。
#
#     reload = "C-]"
#
# 既定を空にしてあるのは、押し間違いで端末が入れ替わる驚きが大きいためです。

[candidates]
# 何番目の候補から横並びの一覧を出すかです。
# 4 なら 4 つ目までは一つずつ送り、5 つ目に達したところで一覧になります。
#inline = 4

# 一覧の出し方です。
#   "inline" … 入力中の行に続けて横並び (既定)。行が伸びて折り返すことがあります。
#   "float"  … カーソルの下の行に一行で浮かせます (最下行なら上の行)。
#              行が伸びず縦にも広がらないので、nvim の補完 popup と重なりにくくなります。
#layout = "inline"

[behavior]
# 押したときに ASCII モードへ戻すキーです。
#
# vim / nvim で挿入モードを抜けたとき、かなモードが残っていると次の `dd` や `:w` が
# 日本語になってしまいます。Esc は挿入モードを抜けるキーそのものなので、これを合図に
# ASCII へ戻します。Esc は子アプリにもそのまま渡るので、vim 側の設定は要りません。
#
# nvim で実測したところ、挿入モードを抜けるのは Esc と C-c でした。C-d は抜けない
# (インデントを一段戻す) ので既定に入れていません。
# 空の並び [] にすると何もしません。
#
# ここに挙げたキーは「子アプリが自分の操作に使っているキーへの便乗」なので、押した
# キーはそのまま子へも渡ります (子の側の動作も起きます)。形を変えずに渡す都合上、
# 拡張鍵盤プロトコルを使うアプリの下では効きません。
#ascii_keys = ["esc", "C-c"]

# 子アプリのカーソルの形に合わせて ASCII モードへ降ろすかどうかです。既定は無効。
#
# vim / nvim は挿入モードで棒、ノーマルモードでブロックにします。その形が棒でなく
# なったら「文字を打つ段ではなくなった」と見て、かなモードを降ろします。
#
# 上の ascii_keys が**押されたキー**を見張るのに対し、こちらは**抜け方に依りません**。
# 割り当て・コマンド・プラグインから抜けても付いていきますし、拡張鍵盤プロトコルを使う
# アプリの下でも効きます。zsh の vi モードのように形でモードを示すシェルでも同じです。
#
# 打ちかけ (変換・辞書登録・定型文を埋めている途中) があるうちは降ろさないので、
# 打ち込んだものが消えることはありません。カーソルの形を別の意味で使うアプリもあるので
# 既定は無効にしてあります。
#follow_cursor_shape = false

# モードの印の出し方です。
#
#   "cell"   … カーソル位置のセルに色を敷きます (既定)。文字を足さないので行の長さも
#              中身も変わりません。カーソルそのものが色付いたように見えます。
#              この方式のときはカーソルの形を下線に固定します (ブロックだと色を覆う
#              ためです)。
#   "symbol" … カーソル位置のセルに半角の記号を出します (下の mode_symbols)。色に
#              頼らないので白黒の端末でもモードが分かります。幅は 1 桁なので見た目も
#              崩れません。cell と違って下にある文字は隠れます。
#   "beside" … カーソルの右隣のセルに色を敷きます。カーソルに覆われないので、
#              多重化器がカーソルの見た目を遅れて同期する環境 (herdr がそうです) でも
#              確実に見えます。この方式ではカーソル自体には色を付けません
#              (色付きのものが二つ並ぶと紛らわしいためです)。
#   "letter" … カーソルの直後に あ / ア / 半 / Ａ を出します。
#   "off"    … 何も描きません。カーソルの形だけでモードを表します。
#
# 端末多重化器を挟むとカーソルの色 (OSC 12) が途中で吸われます (herdr が実際にそうです)。
# 文字として書いた色はそのまま届くので、cell と letter はその性質を使っています。
# ASCII モードでは何も描かないので、そのときの完全透過は保たれます。
#mode_marker = "cell"

# ローマ字の打ち方です。
#   "default" … 標準のローマ字入力 (既定)
#   "azik"    … AZIK (拡張ローマ字入力)。「2 文字めに《ん》が来る」「二重母音」の
#               並びを 2 打で打てます。kz=かん sq=さい kp=こう など。
#               「っ」は ; 、長音は : 、単独の「ん」は q です。
#               シャ行は x、チャ行は c を使います (sh / ch は拡張に使うため打てません)。
#               小書きのかなは l を前置します (la=ぁ lyo=ょ)。
#romaji = "default"

# `.` と `,` から出す句読点の組です。
#   "jp"    … 。 、 (既定)
#   "en"    … ． ，
#   "jp-en" … 。 ，
#   "en-jp" … ． 、
# ddskk の skk-kutouten-type と同じ四通りです。
#kutouten = "jp"

# 打つそばから前方一致の見出し語を見せるかどうかです (動的補完)。
#
# 元は TAB の補完と同じで、押す前から見えるかどうかだけが違います。見せたものは TAB で
# 取り込め、そこから先はいつもの補完と同じように送れます。
#   "off"      … 出しません (既定)。TAB を押したときだけ補完します。
#   "single"   … 見出し語の続きを一つだけ薄く添えます。伸びるのは補う分だけです。
#   "multiple" … 前方一致する見出し語を数件並べます。並べ方は candidates.layout に従います。
#
# 出るのは「▽ の末尾で、かなが一区切りついたところ」だけです。ローマ字が打ちかけの
# うちや、送り仮名に入ったあと、見出し語の途中へ戻ったあとは出ません。
#dynamic_completion = "off"

# 見出し語の入力中にこれらの文字が来たら、その手前までで変換を始めます。
#
# 「ほんやくを」と打つと「を」の直前までの「ほんやく」で変換に入り、「を」は候補の
# 後ろに置かれます。ddskk の skk-auto-start-henkan-keyword-list と同じ顔ぶれです。
# 引き金の文字は見出し語に含めません (含めると辞書を引けないためです)。
#
# 空の並び [] にすると自動変換をしません。一文字ずつの並びでも書けます。
#auto_start_henkan = "を、。．，？」！；：);:）”】』》〉}]?.,!"

# 接頭辞・接尾辞に続けて確定した語を、繋げて辞書に覚えるかどうかです。
# 「さい>」→再 のあと「りよう」→利用 と確定したら さいりよう /再利用/ を覚えます。
# ddskk の skk-learn-combined-word と同じです。
#learn_combined = true

# 送りありの変換で、送り仮名ごとの宛先をどう使うかです。
#
# 送りありの見出し語は、送り仮名が違っても同じになります。「大きい」は OoKii、「多く」は
# OoKu で、どちらも おおk を引きます。見出し語だけで学習すると片方がもう片方を引きずり、
# 「大きい」を確定したあとに「おおく」と打つと ▼大く が出てしまいます。
#
# 確定するたびに送り仮名ごとの宛先も覚えています (利用者辞書には
# おおk /大/多/[き/大/]/[く/多/]/ の形で書かれます。ddskk・CorvusSKK と同じ書き方です)。
# それを引くときにどう効かせるかを選びます。
#
#   "first" … その送り仮名で使った候補を先頭へ寄せ、残りは後ろにそのまま置きます (既定)
#   "only"  … その送り仮名で使った候補だけを出します
#   "off"   … 使いません。見出し語だけで並べます (ddskk の既定と同じです)
#
# 既定を "first" にしてあるのは、候補を隠さないためです。宛先が貯まっていない見出し語
# では並びが変わらないので、いまより悪くなることがありません。
#okuri_match = "first"

# 画面に見えている文章で候補の順序を寄せるかどうかです。既定は有効。
#
# **試験的な機能です。** 将来の版で作りが変わるか、取り除かれることがあります。その
# ときもここに書いたままで壊れないようにします (知らない項目は読み飛ばします)。
#
# 日本語は同音異義語が多すぎます。「こうせい」は SKK-JISYO.L に 20 件を超える候補が
# あり (構成・公正・校正・攻勢・後世・更生・厚生・恒星…)、見出し語だけでは決めよう
# がありません。最近使った順に並べても、話題が変われば外れます。
#
# ttyskk は子アプリの画面の控えを持っているので、子が書いた文字まで文脈にできます。
# 画面はペインごとなので、話題の切れ目が自然に入ります。
#
# 手掛かりは二つです。どちらも辞書に既にある情報なので、余分なファイルは要りません。
#
#   1. 候補そのものが画面にあるか。文章は同じ語を繰り返します
#   2. 注釈の共起語が画面にあるか。SKK-JISYO.L は 校正;proofread.「新聞の-」 の
#      ように用例と訳語を持っています。英語も見るので proofread でも当たります
#
# カーソルから遠いほど軽く見ます (w = 1/(1 + 距離/200)。200 文字で半分)。冪関数なので
# 遠くても消えません — 文書の冒頭で一度だけ書かれた語が手掛かりになることは多いためです。
#
# 手掛かりが無ければ並びを変えないので、関わりの無い画面で悪くなることはありません。
# 引き換えに同じ読みが画面によって違う順で出るようになります。順序を指で覚えている人は
# false にしてください。
#context_order = true

# 文脈の重みが半分になる距離です。単位は**文字数**で、カーソルから数えます。
#
# w(d) = 1 / (1 + d/この値)
#
#   この値 = 200 のとき   同じ行 (40 文字先) 0.83   200 文字先 0.50
#                         800 文字先 0.20           2600 文字先 0.07
#
# 行数ではなく文字数で数えます。一行の文字数はフォントの大きさや多重化器の分割で
# 変わるので、行を単位にすると環境ごとに効き方がぶれるためです。
#
#   小さくする … 近くだけを見ます。話題が細かく切り替わる文書向きです
#   大きくする … 画面全体を平らに見ます。一つの話題が続く長文向きです
#
# 冪関数なので、大きくしても遠くが 0 にはなりません。文書の冒頭に一度だけ書かれた語が
# 手掛かりになることは多いためです。
#context_half_distance = 200

# mode_marker = "symbol" のときに出す記号です。半角一桁の文字だけを書けます。
#
# 既定は「ひらがなは曲線的な ~、カタカナは角ばった +、半角カタカナは + から縦棒を
# 取った - (半分)、全角英数は英数の @」という覚え方です。英字は本文と紛れるので記号に
# しました。反転表示の一桁で見分けやすいのは # * + @ % & ~ = あたりです。
#
# モノクロの記号も使えます。ASCII より形の差が大きいので見分けやすくなります。
#     hiragana = "♪"  katakana = "★"  hankaku_katakana = "☆"  zenkaku = "◆"
# 通るのは ❤ ⚠ ★ ☆ ✓ ✔ ✗ ✖ ♪ ◆ ● ▲ ☺ ❄ ✎ ➤ ✚ ☯ ☀ ☂ ♦ ◎ ⌘ ⚑ ⚙ などです。
# カラーの絵文字 (😀 ⭐ ✅ ☕ ⚡) は幅が二桁なので使えません。❤️ のように異体字セレクタ
# (U+FE0F) が付いたものも二コードポイントになるので不可です (❤ なら通ります)。
#
# ただし ★ ☆ ◆ ● ▲ ◎ ♪ ☺ などは Unicode 上「幅が曖昧」な文字で、ttyskk は一桁と
# 見なしますが端末やフォントの設定によっては二桁で描かれます。その場合は印がずれるので、
# 切り替えて確かめてから使ってください。
[behavior.mode_symbols]
#hiragana = "~"
#katakana = "+"
#hankaku_katakana = "-"
#zenkaku = "@"

# ── スニペット (定型文) ───────────────────────────────────────────────
#
# 住所や電話番号、メールの署名のような「打つのが面倒で、内容が決まっている」
# 文字列を、変換の候補として引けるようにします。辞書登録の画面で一文字ずつ打つ
# 代わりに、手元の編集器で一覧を見ながら書けます。
#
# 書式は VS Code のスニペット (*.code-snippets) です。TextMate 由来のこの書式は
# LSP の仕様にも取り込まれていて、事実上の共通語になっています。nvim の LuaSnip も
# from_vscode で同じファイルを読めるので、編集器と入力メソッドで一つのファイルを
# 分け合えます。注釈 (//) と末尾のカンマを書いてかまいません。
#
#     {
#         // 会社の連絡先。異動があったらここだけ直す
#         "会社住所 (日本語)": {
#             "prefix": "かいしゃじゅうしょ",
#             "body": ["東京都港区…"],
#             "description": "日本語"
#         },
#         "会社住所 (英語)": {
#             "prefix": "かいしゃじゅうしょ",
#             "body": "1-2-3 …, Minato-ku, Tokyo",
#             "description": "英語"
#         },
#     }
#
# prefix が見出し語、body が候補、description が注釈になります。prefix を並びにすると
# 同じ本文を複数の見出し語で引けます。body を並びにすると行として繋がるので、
# SKK の辞書には書けない「改行を含む定型文」も書けます。
#
# body には日付や時刻を書いておけます (TextMate / VS Code と同じ名前です)。
# $CURRENT_YEAR でも ${CURRENT_YEAR} でもかまいません。候補に出る時点でもう開いて
# いるので、確定してから気付くのではなく選んでいる最中に確かめられます。
#
#     "今日の日付": { "prefix": "きょう", "body": "$CURRENT_YEAR-$CURRENT_MONTH-$CURRENT_DATE" },
#     "日報の見出し": { "prefix": "にっぽう", "body": "## $CURRENT_MONTH/$CURRENT_DATE ($CURRENT_DAY_NAME_SHORT)" },
#
# 使えるのは CURRENT_YEAR / CURRENT_YEAR_SHORT / CURRENT_MONTH / CURRENT_MONTH_NAME /
# CURRENT_MONTH_NAME_SHORT / CURRENT_DATE / CURRENT_DAY_NAME / CURRENT_DAY_NAME_SHORT /
# CURRENT_HOUR / CURRENT_MINUTE / CURRENT_SECOND / CURRENT_SECONDS_UNIX です。月名と
# 曜日名は英語 (January、Tue)。知らない名前は書いたまま残るので、$100 のような文字列は
# 素通りします。$ そのものを出したいときは \$ と書いてください。
#
# 覚えた順で並べ替えたりはしません。並びはファイルに書いたとおりに出ますし、確定しても
# 利用者辞書へは写りません (住所を書き換えたときに古い住所が残らないようにするためです)。
# 編集器で保存した時点で読み直すので、ttyskk を起動し直す必要はありません。
#
# 空なら ~/.local/share/ttyskk/snippets.code-snippets だけを読みます。利用者辞書と同じ
# ところなので、辞書を git に載せていれば定型文もそのまま行き来します。学習と分けたい
# 場合や、他の人と分け合いたい場合はここで置き場所を移してください。書いたときは、
# そこに挙げたものだけを読みます (既定の置き場所は読まなくなります)。
#
#     files = ["~/.config/ttyskk/work.code-snippets",
#              "~/.config/ttyskk/private.code-snippets"]
#
# 先頭の ~/ は自分のホームに開きます。
[snippets]
#files = []
