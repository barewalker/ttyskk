# ttyskk の設定の見本。~/.config/ttyskk/config.toml に置く。
#
# 設定できる項目を全部、既定値のまま書き並べて行頭の # で無効にしてある。
# 変えたい行だけ # を外す。書いた項目だけが既定を上書きするので、触らない行は
# 消してしまってもよい。
#
# 手元に取り出す:
#     mkdir -p ~/.config/ttyskk
#     ttyskk --config-example > ~/.config/ttyskk/config.toml
#
# 書き換えると動いている ttyskk にそのまま反映される (起動し直さなくてよい)。
# 書き方を間違えた設定は捨てられ、それまでの設定が使われ続ける。
# 手元で確かめるには `ttyskk --check-config`。
#
# 説明の行は「#」のあとに空白、無効にしてある設定の行は「#」の直後から始まる。

[keys]
# キーの書き方: "C-j" "Ctrl-j" "ctrl+j" / "space" "enter" "tab" "esc" "bs" "s-tab" /
#               "left" "right" "up" "down" "home" "end" / "q" "/" のような一文字そのもの
# 一つの動作に複数割り当てるなら並びで書く: cancel = ["C-g", "esc"]
#
# 矢印と Home / End は端末によって送られる形が違う (CSI 形 / SS3 形 / rxvt 形)。
# 名前で書けばその全部が割り当てになるので、どの端末でも同じように効く。
#
# Ctrl や Shift の付いたキーは、割り当てるとそれだけで Claude Code のような拡張鍵盤
# プロトコルを使うアプリの下でも効く (ttyskk が CSI 106;5u のような形を素の形に戻す
# 対象を、この節から作っているため)。

#kana = "C-j"                # ASCII・全角英数から かなモードへ
#confirm = "C-j"             # 入力中のローマ字・見出し語・候補を確定する
#cancel = "C-g"              # 取り消す
#ascii = "l"                 # ASCII モードへ
#zenkaku = "L"               # 全角英数モードへ
#katakana = "q"              # ひらがな ⇄ カタカナ / ▽ をカタカナにして確定
#hankaku_katakana = "C-q"    # ひらがな ⇄ 半角カタカナ / ▽ を半角カタカナにして確定
#start_conversion = "Q"      # 空の見出し語で変換を始める (複合語向け)
#abbrev = "/"                # ASCII の見出し語で変換する
#convert = "space"           # 変換する / 次の候補へ
#previous = "x"              # 前の候補へ
#complete = "tab"            # ▽ の見出し語を前方一致で補完する / 次の補完候補へ
#complete_previous = "s-tab" # 前の補完候補へ
#purge = "X"                 # ▼ の候補を利用者辞書から取り除く
#affix = ">"                 # 接頭辞・接尾辞変換を始める (▽ の末尾、または ▼ の確定後)

# ▽ の見出し語の中を動いて直すためのキー。▽ でだけ効き、それ以外では子アプリへ
# そのまま渡る。C-g で ▼ から ▽ に戻したあと、打ち間違えた一文字だけを直すのに使う。
#move_left = ["C-b", "left"]      # カーソルを一文字左へ
#move_right = ["C-f", "right"]    # カーソルを一文字右へ
#move_home = ["C-a", "home"]      # 見出し語の先頭へ
#move_end = ["C-e", "end"]        # 見出し語の末尾へ
#delete_forward = "C-d"           # カーソル位置の一文字を消す (backspace は手前を消す)

# カーソルの手前を一文字消すキー。▽ では見出し語から、▼ では前の候補へ戻り、
# 消すものが無ければ Backspace として子アプリへ渡る。ASCII・全角英数モードでも
# 同じで、ここに挙げたキーは**どの段でも消す意味**で子へ届く。
#
# C-h をアプリ自身の操作 (help など) に使いたい場合は ["bs"] だけにする。逆に
# **ここから外したキーは、拡張鍵盤プロトコルを使うアプリ (Claude Code など) の
# 下では ttyskk に届かなくなる** ので、▽ の途中で押すと見出し語がそこで確定する。
#backspace = ["bs", "C-h"]        # 手前の一文字を消す

# 候補一覧から選ぶキー。並び順がそのまま一覧の並び順になり、
# 個数がそのまま一頁の候補数になる。
#select = ["a", "s", "d", "f", "j", "k", "l"]

# 定型文 ([snippets]) を編集器で開くキー。既定は空 (割り当てなし)。かなモードで
# だけ効く。
#
# 辞書登録の途中なら、何も打っていないところで変換キー (space) を押せば
# [スニペットを登録] が出るので、覚えるキーなしで書きに行ける。こちらは「変換に
# 入る前から書きたい」「一覧を見たい」ときのためのもの。
#
# 既定を空にしてあるのは、安全な空きが無いため。ローマ字の先頭にならない英字は
# l と q の二つだけで、どちらも既に使っている。制御キーは端末・シェル・編集器・
# GUI の入力メソッドのどれかが必ず使っていて、空きは環境ごとに違う (C-o は
# emacs の open-line、Windows の keyhac では IME on に割り当てられていることが
# ある)。決め打ちせず、空いているものを自分で選ぶ。
#
#     snippet_edit = "C-t"
#
# 既定が「割り当てなし」なので、他の項目と違って既定値を書いた行は置けない
# (空の並びは書けず、要らないなら項目ごと消す決まりのため)。

[candidates]
# 何番目の候補から横並びの一覧を出すか。
# 4 なら 4 つ目までは一つずつ送り、5 つ目に達したところで一覧になる。
#inline = 4

# 一覧の出し方。
#   "inline" … 入力中の行に続けて横並び (既定)。行が伸びて折り返すことがある。
#   "float"  … カーソルの下の行に一行で浮かせる (最下行なら上の行)。
#              行が伸びず縦にも広がらないので、nvim の補完 popup と重なりにくい。
#layout = "inline"

[behavior]
# 押したときに ASCII モードへ戻すキー。
#
# vim / nvim で挿入モードを抜けたとき、かなモードが残っていると次の `dd` や `:w` が
# 日本語になってしまう。Esc は挿入モードを抜けるキーそのものなので、これを合図に
# ASCII へ戻す。Esc は子アプリにもそのまま渡るので、vim 側の設定は要らない。
#
# nvim で実測したところ、挿入モードを抜けるのは Esc と C-c。C-d は抜けない
# (インデントを一段戻す) ので既定に入れていない。
# 空の並び [] にすると何もしない。
#
# ここに挙げたキーは「子アプリが自分の操作に使っているキーへの便乗」なので、押した
# キーはそのまま子へも渡る (子の側の動作も起きる)。形を変えずに渡す都合上、拡張鍵盤
# プロトコルを使うアプリの下では効かない。
#ascii_keys = ["esc", "C-c"]

# 子アプリのカーソルの形に合わせて ASCII モードへ降ろすか。既定は無効。
#
# vim / nvim は挿入モードで棒、ノーマルモードでブロックにする。その形が棒でなく
# なったら「文字を打つ段ではなくなった」と見て、かなモードを降ろす。
#
# 上の ascii_keys が**押されたキー**を見張るのに対し、こちらは**抜け方に依らない**。
# 割り当て・コマンド・プラグインから抜けても付いていくし、拡張鍵盤プロトコルを使う
# アプリの下でも効く。zsh の vi モードのように形でモードを示すシェルでも同じ。
#
# 打ちかけ (変換・辞書登録・定型文を埋めている途中) があるうちは降ろさないので、
# 打ち込んだものが消えることはない。カーソルの形を別の意味で使うアプリもあるので
# 既定は無効にしてある。
#follow_cursor_shape = false

# モードの印の出し方。
#
#   "cell"   … カーソル位置のセルに色を敷く (既定)。文字を足さないので行の長さも
#              中身も変わらない。カーソルそのものが色付いたように見える。
#              この方式のときはカーソルの形を下線に固定する (ブロックだと色を覆う)。
#   "symbol" … カーソル位置のセルに半角の記号を出す (下の mode_symbols)。色に頼らない
#              ので白黒の端末でもモードが分かる。幅は 1 桁なので見た目も崩れない。
#              cell と違って下にある文字は隠れる。
#   "beside" … カーソルの右隣のセルに色を敷く。カーソルに覆われないので、
#              多重化器がカーソルの見た目を遅れて同期する環境 (herdr がそう) でも
#              確実に見える。この方式ではカーソル自体には色を付けない
#              (色付きのものが二つ並ぶと紛らわしいため)。
#   "letter" … カーソルの直後に あ / ア / 半 / Ａ を出す。
#   "off"    … 何も描かない。カーソルの形だけでモードを表す。
#
# 端末多重化器を挟むとカーソルの色 (OSC 12) が途中で吸われる (herdr が実際にそう)。
# 文字として書いた色はそのまま届くので、cell と letter はその性質を使っている。
# ASCII モードでは何も描かないので、そのときの完全透過は保たれる。
#mode_marker = "cell"

# ローマ字の打ち方。
#   "default" … 標準のローマ字入力 (既定)
#   "azik"    … AZIK (拡張ローマ字入力)。「2 文字めに《ん》が来る」「二重母音」の
#               並びを 2 打で打てる。kz=かん sq=さい kp=こう など。
#               「っ」は ; 、長音は : 、単独の「ん」は q。
#               シャ行は x、チャ行は c を使う (sh / ch は拡張に使うため打てない)。
#               小書きのかなは l を前置する (la=ぁ lyo=ょ)。
#romaji = "default"

# `.` と `,` から出す句読点の組。
#   "jp"    … 。 、 (既定)
#   "en"    … ． ，
#   "jp-en" … 。 ，
#   "en-jp" … ． 、
# ddskk の skk-kutouten-type と同じ四通り。
#kutouten = "jp"

# 見出し語の入力中にこれらの文字が来たら、その手前までで変換を始める。
#
# 「ほんやくを」と打つと「を」の直前までの「ほんやく」で変換に入り、「を」は候補の
# 後ろに置かれる。ddskk の skk-auto-start-henkan-keyword-list と同じ顔ぶれ。
# 引き金の文字は見出し語に含めない (含めると辞書を引けない)。
#
# 空の並び [] にすると自動変換をしない。一文字ずつの並びでも書ける。
#auto_start_henkan = "を、。．，？」！；：);:）”】』》〉}]?.,!"

# 接頭辞・接尾辞に続けて確定した語を、繋げて辞書に覚えるか。
# 「さい>」→再 のあと「りよう」→利用 と確定したら さいりよう /再利用/ を覚える。
# ddskk の skk-learn-combined-word と同じ。
#learn_combined = true

# mode_marker = "symbol" のときに出す記号。半角一桁の文字だけ。
#
# 既定は「ひらがなは曲線的な ~、カタカナは角ばった +、半角カタカナは + から縦棒を
# 取った - (半分)、全角英数は英数の @」という覚え方。英字は本文と紛れるので記号にした。
# 反転表示の一桁で見分けやすいのは # * + @ % & ~ = あたり。
#
# モノクロの記号も使える。ASCII より形の差が大きいので見分けやすい。
#     hiragana = "♪"  katakana = "★"  hankaku_katakana = "☆"  zenkaku = "◆"
# 通るのは ❤ ⚠ ★ ☆ ✓ ✔ ✗ ✖ ♪ ◆ ● ▲ ☺ ❄ ✎ ➤ ✚ ☯ ☀ ☂ ♦ ◎ ⌘ ⚑ ⚙ など。
# カラーの絵文字 (😀 ⭐ ✅ ☕ ⚡) は幅が二桁なので使えない。❤️ のように異体字セレクタ
# (U+FE0F) が付いたものも二コードポイントになるので不可 (❤ なら通る)。
#
# ただし ★ ☆ ◆ ● ▲ ◎ ♪ ☺ などは Unicode 上「幅が曖昧」な文字で、ttyskk は一桁と
# 見なすが端末やフォントの設定によっては二桁で描かれる。その場合は印がずれるので、
# 切り替えて確かめてから使う。
[behavior.mode_symbols]
#hiragana = "~"
#katakana = "+"
#hankaku_katakana = "-"
#zenkaku = "@"

# ── スニペット (定型文) ───────────────────────────────────────────────
#
# 住所や電話番号、メールの署名のような「打つのが面倒で、内容が決まっている」
# 文字列を、変換の候補として引けるようにする。辞書登録の画面で一文字ずつ打つ
# 代わりに、手元の編集器で一覧を見ながら書く。
#
# 書式は VS Code のスニペット (*.code-snippets)。TextMate 由来のこの書式は
# LSP の仕様にも取り込まれていて、事実上の共通語になっている。nvim の LuaSnip も
# from_vscode で同じファイルを読めるので、編集器と入力メソッドで一つのファイルを
# 分け合える。注釈 (//) と末尾のカンマを書いてよい。
#
#     {
#         // 会社の連絡先。異動があったらここだけ直す
#         "会社住所 (日本語)": {
#             "prefix": "かいしゃじゅうしょ",
#             "body": ["東京都港区…"],
#             "description": "日本語"
#         },
#         "会社住所 (英語)": {
#             "prefix": "かいしゃじゅうしょ",
#             "body": "1-2-3 …, Minato-ku, Tokyo",
#             "description": "英語"
#         },
#     }
#
# prefix が見出し語、body が候補、description が注釈になる。prefix を並びにすると
# 同じ本文を複数の見出し語で引ける。body を並びにすると行として繋がるので、
# SKK の辞書には書けない「改行を含む定型文」も書ける。
#
# body には日付や時刻を書いておける (TextMate / VS Code と同じ名前)。$CURRENT_YEAR
# でも ${CURRENT_YEAR} でもよい。候補に出る時点でもう開いているので、確定してから
# 気付くのではなく選んでいる最中に確かめられる。
#
#     "今日の日付": { "prefix": "きょう", "body": "$CURRENT_YEAR-$CURRENT_MONTH-$CURRENT_DATE" },
#     "日報の見出し": { "prefix": "にっぽう", "body": "## $CURRENT_MONTH/$CURRENT_DATE ($CURRENT_DAY_NAME_SHORT)" },
#
# 使えるのは CURRENT_YEAR / CURRENT_YEAR_SHORT / CURRENT_MONTH / CURRENT_MONTH_NAME /
# CURRENT_MONTH_NAME_SHORT / CURRENT_DATE / CURRENT_DAY_NAME / CURRENT_DAY_NAME_SHORT /
# CURRENT_HOUR / CURRENT_MINUTE / CURRENT_SECOND / CURRENT_SECONDS_UNIX。月名と曜日名は
# 英語 (January、Tue)。知らない名前は書いたまま残るので、$100 のような文字列は素通りする。
# $ そのものを出したいときは \$ と書く。
#
# 覚えた順で並べ替えたりはしない。並びはファイルに書いたとおりに出るし、確定しても
# 利用者辞書へは写らない (住所を書き換えたときに古い住所が残らないようにするため)。
# 編集器で保存した時点で読み直すので、ttyskk を起動し直さなくてよい。
#
# 空なら ~/.local/share/ttyskk/snippets.code-snippets だけを読む。利用者辞書と同じ
# ところなので、辞書を git に載せていれば定型文もそのまま行き来する。学習と分けたい
# 場合や、他の人と分け合いたい場合はここで置き場所を移す。書いたときは、そこに
# 挙げたものだけを読む (既定の置き場所は読まなくなる)。
#
#     files = ["~/.config/ttyskk/work.code-snippets",
#              "~/.config/ttyskk/private.code-snippets"]
#
# 先頭の ~/ は自分のホームに開く。
[snippets]
#files = []
