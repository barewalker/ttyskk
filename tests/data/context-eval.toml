# 画面の文脈で候補を選び分ける力を測る問題集。
#
# 測るのは一つだけ。**正解の候補が何番目に出るか** = 空白を余計に何回押すか。
# 走らせ方と数字の読み方は `tests/context_eval.rs` の冒頭に書いてある。
#
# ## 書くときの決まり
#
# - **候補の一覧はここに書かない。** 辞書 (SKK-JISYO.L) から引く。書き写すと辞書が
#   育ったときに嘘になる
# - `context` は画面に見えている文章。**前後の空白を落とした末尾がカーソル位置**
# - `expect` は辞書の候補そのまま。送りありは語幹だけ書く (「切」)
# - **`pair` の文脈に正解の表記をそのまま書かない** (書くと `surface` と同じ問題に
#   なり、難しさが消える)。試験がこれを見張る
# - **同じ読みを、正解が入れ替わる二つの文脈で持つ** (`pair` が同じ組)。こうしないと
#   「こうせいは常に校正」と決め打ちした実装でも満点が出てしまう
# - **実装の出力を見てから文脈を書き換えない。** 先に文章を書き、後で測る
# - 長さは 80〜400 字ほど。短すぎると手掛かりが無く、長すぎると距離の重みが見えない
#
# ## 入れてはいけないもの
#
# 文章はすべて架空の自作。実在の人名・社名・製品名・住所・連絡先・ホスト名・実在の
# 経路・業務の内容は書かない。題材は公共の話題に限る。

[meta]
jisyo = "SKK-JISYO.L"
origin = "全文自作"
forbid_means = "並べ替えで順位を上げてはいけない候補 (辞書順との比較で判定する)"

