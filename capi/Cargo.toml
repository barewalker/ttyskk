[package]
name = "ttyskk-capi"
version = "0.4.3"
edition = "2024"
description = "C ABI for the ttyskk SKK conversion engine, for use from input method frameworks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barewalker/ttyskk"
rust-version = "1.88"
# crates.io には出さない。**Rust から使える形になっていない** — 下の crate-type が
# cdylib と staticlib だけで rlib を出さないので、依存に書いても繋がらない。実行
# ファイルも無いので cargo install もできない。fcitx5 の addon を組む人は git から
# 取るので、書庫に出しても置き場所が増えるだけ。
publish = false

[lib]
# fcitx5 の addon から静的に取り込む (libttyskk.a)。共有ライブラリも一応出す。
#
# rlib は出さない。ルートの crate も lib 名が ttyskk なので、両方が rlib を出すと
# 「どちらの ttyskk か」が定まらず doc test のリンクで詰まる。
name = "ttyskk"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# 端末側の実装は要らないので落とす。
ttyskk = { path = "..", default-features = false }

[build-dependencies]
cbindgen = "0.29"
