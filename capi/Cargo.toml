[package]
name = "ttyskk-capi"
version = "0.1.1"
edition = "2024"
description = "C ABI for the ttyskk SKK conversion engine, for use from input method frameworks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barewalker/ttyskk"
rust-version = "1.88"

[lib]
# fcitx5 の addon から静的に取り込む (libttyskk.a)。共有ライブラリも一応出す。
#
# rlib は出さない。ルートの crate も lib 名が ttyskk なので、両方が rlib を出すと
# 「どちらの ttyskk か」が定まらず doc test のリンクで詰まる。
name = "ttyskk"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# 端末側の実装は要らないので落とす。
#
# **crates.io に出すには版の指定が要る。** path だけだと手元でしか解決できないので、
# 公開した書庫から組み立てられない。手元では path が優先されるので、開発中の動きは
# 変わらない。
ttyskk = { path = "..", version = "0.1.1", default-features = false }

[build-dependencies]
cbindgen = "0.29"
